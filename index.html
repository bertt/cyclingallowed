<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cycling allowed - Where are you allowed to cycle? (OpenFreeMap)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #legend { position: absolute; top: 150px; right: 10px; background: #fffffff0; padding: 8px 10px;
            border-radius: 6px; box-shadow: 0 1px 4px #0004; font-size: 12px; max-height: calc(100% - 210px); overflow: auto; }
  #title { position: absolute; top: 10px; left: 10px; background: #fffffff0; padding: 8px 12px; border-radius: 6px;
           box-shadow: 0 1px 4px #0004; font-weight: 600; font-size: 16px; }
  #title .sub { font-size: 13px; font-weight: 500; color: #333; }
  #title small { display: block; font-weight: 400; font-size: 11px; margin-top: 2px; }
  #legend h4 { margin: 0; font-size: 13px; }
  #legend .lhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  #legend #toggle { width: 22px; height: 22px; border: 1px solid #888; border-radius: 4px; background: #fff; color: #333;
                    font: bold 14px/1 sans-serif; padding: 0; cursor: pointer; }
  #legend.collapsed { overflow: visible; }
  #legend.collapsed > :not(.lhead), #legend.collapsed .desc { display: none; }
  #legend.collapsed .lhead { margin-bottom: 0; }
  #legend .item { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #legend .item span { flex: 1; }
  #legend .info { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid #888; background: #fff;
                  color: #333; font: italic bold 12px serif; line-height: 1; padding: 0; cursor: pointer; }
  #legend .info[aria-expanded=true] { background: #333; color: #fff; }
  #legend .desc { margin: 2px 0 6px 36px; padding: 6px 8px; background: #f3f3f3; border-radius: 4px; color: #333; max-width: 200px; }
  #legend .desc[hidden] { display: none; }
  #legend svg { flex: none; }
  #warning { margin-top: 8px; padding: 6px 8px; max-width: 210px; background: #fff4e5; border: 1px solid #f0b46c; border-radius: 4px; color: #7a4100; }
  #note { margin-top: 6px; color: #555; max-width: 210px; }
  #pegman { position: absolute; top: 108px; right: 10px; width: 29px; height: 29px; box-sizing: border-box; padding: 3px;
            background: #fff; border: 0; border-radius: 4px; box-shadow: 0 0 0 2px #0001; cursor: grab; touch-action: none; z-index: 2; }
  #pegman svg { width: 100%; height: 100%; pointer-events: none; }
  #pegman-ghost { position: fixed; width: 34px; height: 34px; margin: -31px 0 0 -17px; pointer-events: none; z-index: 1000; display: none; }
  #pegman-ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 2px #0006); }
  #pegman-ghost::after, .sv-marker::after { content: ''; position: absolute; left: 50%; top: 31px; width: 22px; height: 10px;
            margin: -5px 0 0 -11px; border: 2px solid #1a73e8; border-radius: 50%; background: #1a73e855; box-sizing: border-box; }
  .sv-marker { position: relative; width: 34px; height: 34px; cursor: grab; }
  .sv-marker svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 2px #0006); }
  body.dragging-pegman, body.dragging-pegman * { cursor: grabbing !important; }
  #sv-panel { position: absolute; left: 10px; bottom: 28px; width: min(520px, calc(100% - 20px)); height: min(340px, 50%);
              background: #fff; border-radius: 6px; box-shadow: 0 2px 10px #0006; z-index: 3; display: none; flex-direction: column; overflow: hidden; }
  #sv-panel .bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; font-size: 12px; background: #f3f3f3; }
  #sv-panel .bar button { border: 0; background: none; font-size: 18px; line-height: 1; cursor: pointer; }
  #sv-panel iframe { flex: 1; border: 0; width: 100%; }
</style>

<body>
<div id="map"></div>
<div id="title">Cycling allowed?<small class="sub">Where are you allowed to cycle?</small><small>Idea: <a href="https://qgiscloud.com/PeeWee32/OSMNL_Highway/?l=Info%20%2Ctoegankelijkheid_fiets&bl=mapnik&t=OSMNL_Highway&e=554693%2C6809530%2C558757%2C6811622" target="_blank" rel="noopener">OSMNL_Highway by PeeWee32</a> (QGIS Cloud)</small><small>Created by Bert Temme &middot; <a href="https://github.com/bertt/cyclingallowed/issues" target="_blank" rel="noopener">Report an issue</a></small></div>
<div id="legend"><div class="lhead"><h4>Legend</h4><button id="toggle" type="button" aria-label="Collapse legend" aria-expanded="true">&minus;</button></div></div>
<script>
// Classes: [name used in expressions, color, width factor, dashed, arrow, legend label]
const CLASSES = [
  ['yes explicit',          '#238823', 1,   false, null, 'Yes (explicit)'],
  ['yes implicit',          '#82d941', 1,   false, null, 'Yes (implicit)'],
  ['yes forward explicit',     '#238823', 0.7, false, 1, 'Yes, one-way only (explicit)'],
  ['yes forward implicit',     '#82d941', 0.7, false, 1, 'Yes, one-way only (implicit)'],
  ['yes backward explicit',    '#238823', 0.7, false, -1, 'Yes, backward only (explicit)'],
  ['yes backward implicit',    '#82d941', 0.7, false, -1, 'Yes, backward only (implicit)'],
  ['dismount explicit','#1029f2', 1,   true,  null, 'Dismount (explicit)'],
  ['no explicit',           '#e31a1c', 0.6, false, null, 'No (explicit)'],
    ['no implicit',         '#ec7e31', 0.6,   false, null, 'No (implicit)'],
  ['probably yes',     '#a8c97f', 1,   false, null, 'Probably yes'],
  ['probably no',    '#f4a582', 1,   false, null, 'Probably no'],
  ['questionable',            '#7c8aa5', 1,   false, null, 'Questionable'],
];

// Tooltip text for the legend (hover)
const DESCRIPTIONS = {
  'yes explicit': 'Cycling is explicitly allowed: tagged bicycle=yes/designated/permissive, or a cycleway (highway=cycleway).',
  'yes implicit': 'Cycling is allowed by default for this road type (residential, unclassified, tertiary, secondary, primary, living street) because no tag forbids it.',
  'yes forward explicit': 'Explicitly cycle-friendly, but one-way: cycling is only allowed in the direction of the arrow on the map (oneway=yes, or oneway=-1 where the arrow points against the drawing direction).',
  'yes forward implicit': 'Allowed by default road type, but one-way: only in the direction of the arrow on the map. Note: contraflow cycling (oneway:bicycle=no) cannot be detected in these tiles.',
  'yes backward explicit': 'Explicitly cycle-friendly, one-way against the digitised direction (oneway=-1): only in the direction of the arrow.',
  'yes backward implicit': 'Allowed by default road type, one-way against the digitised direction (oneway=-1): only in the direction of the arrow.',
  'dismount explicit': 'Cyclists must dismount and walk the bike (bicycle=dismount).',
  'no explicit': 'Cycling is explicitly forbidden: bicycle=no or bicycle=use_sidepath (use the separate cycle path), or access=no/private.',
  'no implicit': 'Cycling is not allowed by default for this road type: motorway, trunk, footway, pedestrian area, steps, platform.',
  'probably yes': 'Probably cyclable, but not tagged for bicycles: a path or track with a paved surface (asphalt, paved, concrete, paving stones, compacted, fine gravel) or foot=yes, or a normal service road (e.g. alley). A guess based on surface and road subtype.',
  'probably no': 'Probably not cyclable, but not tagged for bicycles: a path or track with an unpaved surface (ground, dirt, sand, grass, mud, etc.) or an MTB grade, or a service road that is a driveway, parking aisle, drive-through or emergency access. A guess based on surface and road subtype.',
  'questionable': 'Unclear: paths, tracks and bridleways without a bicycle or access tag and without a surface that settles it. Often passable, but not guaranteed to be allowed.',
};
// Route styling lives in a separate Mapbox GL style fragment; legend and popups are derived from it
const ROUTE_STYLE = fetch('cycle-routes-style.json').then(r => r.json());
const ROUTE_NETWORKS = []; // [code, color, label], top layer (international) first
const get = k => ['get', k];
const bicycle = get('bicycle'), access = get('access'), sub = get('subclass'), cls = get('class');
const oneway = ['coalesce', get('oneway'), 0];
const surface = get('surface'), service = get('service'), foot = get('foot');
const PAVED = ['asphalt', 'paved', 'concrete', 'concrete:plates', 'concrete:lanes', 'paving_stones', 'sett', 'compacted', 'fine_gravel'];
const UNPAVED = ['unpaved', 'ground', 'dirt', 'earth', 'sand', 'grass', 'mud', 'gravel', 'pebblestone', 'rock', 'woodchips', 'snow', 'ice'];
const NO_SERVICE = ['driveway', 'parking_aisle', 'drive-through', 'emergency_access'];
const isIn = (v, list) => ['in', v, ['literal', list]];

// Approximation of the WFS "toegankelijk" classification using the attributes in the
// OpenMapTiles "transportation" layer (class, subclass, bicycle, access, oneway).
const explicitNo  = ['any', isIn(bicycle, ['no', 'use_sidepath']), isIn(access, ['no', 'private'])];
const explicitYes = ['any', isIn(bicycle, ['yes', 'designated', 'permissive']), ['==', sub, 'cycleway']];
const implicitNo  = ['any', isIn(cls, ['motorway', 'trunk']),
                     ['all', ['==', cls, 'path'], isIn(sub, ['footway', 'pedestrian', 'steps', 'platform', 'corridor'])]];
const implicitYes = isIn(cls, ['primary', 'secondary', 'tertiary', 'minor']);
const dir = (fwd, back, both) => ['case', ['==', oneway, 1], fwd, ['==', oneway, -1], back, both];

const CLASS_EXPR = ['case',
  explicitNo, 'no explicit',
  ['==', bicycle, 'dismount'], 'dismount explicit',
  explicitYes, dir('yes forward explicit', 'yes backward explicit', 'yes explicit'),
  implicitNo, 'no implicit',
  implicitYes, dir('yes forward implicit', 'yes backward implicit', 'yes implicit'),
  ['all', isIn(cls, ['path', 'track']), ['any', isIn(surface, UNPAVED), ['has', 'mtb_scale']]], 'probably no',
  ['all', ['==', cls, 'service'], isIn(service, NO_SERVICE)], 'probably no',
  ['all', isIn(cls, ['path', 'track']), ['any', isIn(surface, PAVED), ['==', foot, 'yes']]], 'probably yes',
  ['==', cls, 'service'], 'probably yes',
  'questionable'];

const ROAD_CLASSES = ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor', 'service', 'track', 'path'];
const colorExpr = ['match', CLASS_EXPR, ...CLASSES.flatMap(c => [c[0], c[1]]), '#000'];
const widthFactor = ['match', CLASS_EXPR, ...CLASSES.flatMap(c => [c[0], c[2]]), 1];
const width = base => ['interpolate', ['linear'], ['zoom'],
  10, ['*', widthFactor, base * 0.4], 14, ['*', widthFactor, base], 18, ['*', widthFactor, base * 3]];

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron',
  center: [5.283, 52.053], zoom: 14, hash: true
});
map.addControl(new maplibregl.NavigationControl());

// Street View: drag the pegman onto the map to open Google Street View in a panel
const PEGMAN_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="3.2" fill="#f9a825"/><path d="M12 9c-3 0-4.5 1.5-4.5 4v3.5h2V22h5v-5.5h2V13c0-2.5-1.5-4-4.5-4z" fill="#f9a825" stroke="#c77800" stroke-width=".8"/></svg>';
(() => {
  const mapEl = document.getElementById('map');
  const btn = document.createElement('button');
  btn.id = 'pegman'; btn.type = 'button'; btn.title = 'Drag onto the map for Street View'; btn.innerHTML = PEGMAN_SVG;
  const ghost = document.createElement('div');
  ghost.id = 'pegman-ghost'; ghost.innerHTML = PEGMAN_SVG;
  const panel = document.createElement('div');
  panel.id = 'sv-panel';
  panel.innerHTML = '<div class="bar"><span>Google Street View</span><span><a target="_blank" rel="noopener">Open in Google Maps</a> <button type="button" aria-label="Close">&times;</button></span></div><iframe allowfullscreen loading="lazy"></iframe>';
  document.body.append(btn, ghost, panel);
  const frame = panel.querySelector('iframe'), ext = panel.querySelector('a');
  let marker;

  const COVERAGE = 'https://www.google.com/maps/vt?pb=!1m7!8m6!1m3!1i{z}!2i{x}!3i{y}!2i9!3x1!2m8!1e2!2ssvv!4m2!1scc!2s*211m3*211e2*212b1*213e2*212b1*214b1!4m2!1ssvl!2s*211b0*212b1!3m8!2snl!3sUS!5e18!12m4!1e68!2m2!1sset!2sRoadmap!12m3!1e37!2m1!1ssmartmaps!4e0';
  const COVERAGE_Z = 17, tileCache = new Map();
  const coverageTile = (x, y) => {
    const key = `${x}/${y}`;
    if (!tileCache.has(key)) {
      const url = COVERAGE.replace('{z}', COVERAGE_Z).replace('{x}', x).replace('{y}', y);
      tileCache.set(key, fetch(url, { mode: 'cors' }).then(r => r.blob()).then(createImageBitmap).then(bmp => {
        const c = document.createElement('canvas'); c.width = c.height = 256;
        const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(bmp, 0, 0, 256, 256);
        return g.getImageData(0, 0, 256, 256).data;
      }).catch(() => null));
    }
    return tileCache.get(key);
  };
  // true if a Street View coverage line lies within radius px (zoom-17 pixels) of the location; unknown (fetch failure) counts as true
  async function hasStreetView(ll, radius = 12) {
    const n = 2 ** COVERAGE_Z, rad = ll.lat * Math.PI / 180;
    const xf = (ll.lng + 180) / 360 * n, yf = (1 - Math.asinh(Math.tan(rad)) / Math.PI) / 2 * n;
    const x = Math.floor(xf), y = Math.floor(yf), px = Math.floor((xf - x) * 256), py = Math.floor((yf - y) * 256);
    const data = await coverageTile(x, y);
    if (!data) return true;
    for (let j = Math.max(0, py - radius); j <= Math.min(255, py + radius); j++)
      for (let i = Math.max(0, px - radius); i <= Math.min(255, px + radius); i++)
        if (data[(j * 256 + i) * 4 + 3] > 20) return true;
    return false;
  }
  window.hasStreetView = hasStreetView;

  let dragging = false;
  // blue coverage lines are visible while dragging the pegman or while the panel is open
  function syncCoverage() {
    const show = dragging || panel.style.display === 'flex';
    if (show && !map.getSource('sv-coverage')) {
      map.addSource('sv-coverage', { type: 'raster', tiles: [COVERAGE], tileSize: 256, maxzoom: 21 });
      map.addLayer({ id: 'sv-coverage', type: 'raster', source: 'sv-coverage', paint: { 'raster-opacity': 0.85 } });
    }
    if (map.getLayer('sv-coverage')) map.setLayoutProperty('sv-coverage', 'visibility', show ? 'visible' : 'none');
  }

  const close = () => { panel.style.display = 'none'; frame.src = 'about:blank'; marker?.remove(); marker = null; syncCoverage(); };
  panel.querySelector('button').onclick = close;

  async function open(ll) {
    window.svPreview?.hide();
    if (!await hasStreetView(ll, 25)) return;
    const c = `${ll.lat.toFixed(6)},${ll.lng.toFixed(6)}`;
    frame.src = `https://maps.google.com/maps?layer=c&cbll=${c}&cbp=12,0,0,0,0&output=svembed`;
    ext.href = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${c}`;
    panel.style.display = 'flex';
    if (!marker) { const el = document.createElement('div'); el.className = 'sv-marker'; el.innerHTML = PEGMAN_SVG;
      marker = new maplibregl.Marker({ element: el, anchor: 'top', offset: [0, -31], draggable: true });
      marker.on('drag', () => svPreview.show(marker.getLngLat(), 150));
      marker.on('dragend', () => open(marker.getLngLat())); }
    marker.setLngLat(ll).addTo(map);
    syncCoverage();
  }
  window.openStreetView = open;
  window.streetViewOpen = () => panel.style.display === 'flex';
  window.streetViewEmbed = ll => `https://maps.google.com/maps?layer=c&cbll=${ll.lat.toFixed(6)},${ll.lng.toFixed(6)}&cbp=12,0,0,0,0&output=svembed`;
  const move = e => {
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    if (!dragging || !window.svPreview) return;
    const r = mapEl.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom)
      svPreview.show(map.unproject([e.clientX - r.left, e.clientY - r.top]), 150);
    else svPreview.hide();
  };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    btn.setPointerCapture(e.pointerId);
    close(); window.svPreview?.hide();
    ghost.style.display = 'block'; document.body.classList.add('dragging-pegman'); move(e);
    dragging = true; syncCoverage();
  });
  btn.addEventListener('pointermove', e => { if (btn.hasPointerCapture(e.pointerId)) move(e); });
  btn.addEventListener('pointerup', e => {
    ghost.style.display = 'none'; document.body.classList.remove('dragging-pegman');
    dragging = false; window.svPreview?.hide();
    const r = mapEl.getBoundingClientRect(), b = btn.getBoundingClientRect();
    const over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    const onBtn = e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom;
    if (over && !onBtn) open(map.unproject([e.clientX - r.left, e.clientY - r.top]));
    syncCoverage();
  });
  btn.addEventListener('pointercancel', () => { ghost.style.display = 'none'; document.body.classList.remove('dragging-pegman'); dragging = false; syncCoverage(); });
})();
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }));

function arrowImage() {
  const s = 32, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#170a14'; g.strokeStyle = '#fff'; g.lineWidth = 3; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(6, 6); g.lineTo(26, 16); g.lineTo(6, 26); g.closePath(); g.stroke(); g.fill();
  return g.getImageData(0, 0, s, s);
}

map.on('load', async () => {
  const routeStyle = await ROUTE_STYLE;
  // insert below the first label layer so names stay readable
  const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  const src = { source: 'openmaptiles', 'source-layer': 'transportation' };
  const base = ['all', isIn(cls, ROAD_CLASSES), ['!=', ['coalesce', get('brunnel'), ''], 'tunnel']];

  if (!map.hasImage('cycling-arrow')) map.addImage('cycling-arrow', arrowImage());

  // Cycle route networks (Maptoolkit vector tiles), drawn as a wide band under the access lines
  for (const [id, s] of Object.entries(routeStyle.sources)) map.addSource(id, s);
  for (const l of routeStyle.layers) map.addLayer(l, firstSymbol);
  ROUTE_NETWORKS.push(...routeStyle.layers.map(l => [l.metadata.network, l.paint['line-color'], l.metadata.label,
    l.layout.visibility !== 'none']).reverse());
  const routeLegend = document.getElementById('route-legend');
  for (const [code, color, label, visible] of ROUTE_NETWORKS) {
    routeLegend.insertAdjacentHTML('beforeend',
      `<label class="item"><svg width="30" height="14"><line x1="2" y1="7" x2="28" y2="7" stroke="${color}" stroke-width="6" stroke-linecap="round" opacity="0.75"/></svg>` +
      `<span>${label}</span><input type="checkbox" data-route="${code}" ${visible ? 'checked' : ''}></label>`);
  }

  map.addLayer({ id: 'cycling', type: 'line', ...src, minzoom: 10, filter: base,
    layout: { 'line-cap': 'butt', 'line-join': 'round' },
    paint: { 'line-color': colorExpr, 'line-width': width(2) } }, firstSymbol);

  map.addLayer({ id: 'cycling-dismount', type: 'line', ...src, minzoom: 10,
    filter: ['all', base, ['match', CLASS_EXPR, ['dismount explicit', 'probably yes', 'probably no'], true, false]],
    paint: { 'line-color': '#fff', 'line-width': width(1), 'line-dasharray': [1, 2] } }, firstSymbol);

  // arrows for one-way classes, drawn on top of everything (also above labels) so they stay visible
  const oneWayNames = CLASSES.filter(c => c[4]).map(c => c[0]);
  map.addLayer({ id: 'cycling-arrows', type: 'symbol', ...src, minzoom: 12,
    filter: ['all', base, ['match', CLASS_EXPR, oneWayNames, true, false]],
    layout: { 'symbol-placement': 'line', 'symbol-spacing': 50, 'icon-image': 'cycling-arrow', 'icon-size': 0.7,
              'icon-allow-overlap': true, 'icon-ignore-placement': true, 'icon-pitch-alignment': 'map',
              'icon-rotate': ['case', ['==', oneway, -1], 180, 0], 'icon-rotation-alignment': 'map' } });

  map.addSource('selected', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'selected-halo', type: 'line', source: 'selected',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffd400', 'line-opacity': 0.8,
             'line-width': ['interpolate', ['linear'], ['zoom'], 10, 5, 14, 14, 18, 30] } }, 'cycling');

  // Vector tiles merge adjacent ways with equal attributes into one line, so highlight only
  // the single segment of the clicked line nearest to the click point.
  const localPart = (geom, ll) => {
    const lines = geom.type === 'MultiLineString' ? geom.coordinates : geom.type === 'LineString' ? [geom.coordinates] : null;
    if (!lines) return geom;
    const k = Math.cos(ll.lat * Math.PI / 180), m = 111320;
    const d = (a, b) => Math.hypot((a[0] - b[0]) * k * m, (a[1] - b[1]) * m);
    let best = { dist: Infinity };
    lines.forEach((line, li) => {
      for (let i = 0; i < line.length - 1; i++) {
        const a = line[i], b = line[i + 1];
        const dx = (b[0] - a[0]) * k * m, dy = (b[1] - a[1]) * m;
        const len2 = dx * dx + dy * dy;
        const t = len2 ? Math.max(0, Math.min(1, (((ll.lng - a[0]) * k * m) * dx + ((ll.lat - a[1]) * m) * dy) / len2)) : 0;
        const p = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
        const dist = d(p, [ll.lng, ll.lat]);
        if (dist < best.dist) best = { dist, li, i, p };
      }
    });
    if (!best.p) return geom;
    const line = lines[best.li];
    return { type: 'LineString', coordinates: [line[best.i], line[best.i + 1]] };
  };
  const select = (f, ll) => map.getSource('selected').setData(
    f ? { type: 'Feature', geometry: localPart(f.geometry, ll), properties: {} } : { type: 'FeatureCollection', features: [] });
  let popup;

  const hitBox = p => [[p.x - 8, p.y - 8], [p.x + 8, p.y + 8]];

  const routeLayers = ROUTE_NETWORKS.map(r => 'route-' + r[0]);
  const routeAt = point => {
    const feats = map.queryRenderedFeatures(hitBox(point), { layers: routeLayers.filter(id => map.getLayoutProperty(id, 'visibility') !== 'none') });
    return feats.sort((a, b) => routeLayers.indexOf(a.layer.id) - routeLayers.indexOf(b.layer.id))[0];
  };

  map.on('click', e => {
    const box = hitBox(e.point);
    if (popup) popup.remove();
    // cycle routes take priority over the access layer
    const r = routeAt(e.point);
    if (r) {
      select(null);
      const net = ROUTE_NETWORKS.find(n => n[0] === r.properties.cycling_network);
      const rows = Object.entries(r.properties).map(([k, v]) => `<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join('');
      popup = new maplibregl.Popup({ maxWidth: '300px' }).setLngLat(e.lngLat)
        .setHTML(`<div style="margin-bottom:4px"><b style="color:${net[1]}">${net[2]}</b></div><table>${rows}</table>`).addTo(map);
      return;
    }
    const f = map.queryRenderedFeatures(box, { layers: ['cycling'] })[0];
    if (!f) return select(null);
    select(f, e.lngLat);

    // find the computed class by testing each class filter on the same feature
    const same = g => JSON.stringify(g.properties) === JSON.stringify(f.properties);
    const hit = CLASSES.find(c =>
      map.queryRenderedFeatures(box, { layers: ['cycling'], filter: ['==', CLASS_EXPR, c[0]] }).some(same));
    const rows = Object.entries(f.properties).map(([k, v]) => `<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join('');
    const head = hit ? `<div style="margin-bottom:4px"><b>${hit[5]}</b> <small>(${hit[0]})</small></div>` : '';
    const preview = `<div id="sv-big-wrap" style="margin-top:6px" hidden><a href="#" id="sv-big">Larger Street View</a></div>`;
    popup = new maplibregl.Popup({ maxWidth: '300px' }).setLngLat(e.lngLat)
      .setHTML(`${head}<table>${rows}</table>${preview}`).addTo(map);
    const wrap = popup.getElement().querySelector('#sv-big-wrap');
    hasStreetView(e.lngLat, 25).then(ok => { wrap.hidden = !ok; });
    popup.getElement().querySelector('#sv-big').onclick = ev => { ev.preventDefault(); openStreetView(e.lngLat); };
    popup.on('close', () => select(null));
  });

  // hover: small Street View preview next to the cursor while over a road
  let hoverPopup, hoverTimer, hoverToken;
  const hideHover = () => { clearTimeout(hoverTimer); hoverToken = null; hoverPopup?.remove(); hoverPopup = null; };
  const showHover = (ll, delay) => {
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(async () => {
      hideHover();
      const token = hoverToken = {};
      if (!await hasStreetView(ll) || token !== hoverToken) return;
      hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, maxWidth: '240px', offset: 14, anchor: 'left' })
        .setLngLat(ll)
        .setHTML(`<iframe src="${streetViewEmbed(ll)}" style="border:0;width:220px;height:130px;pointer-events:none"></iframe>`)
        .addTo(map);
      hoverPopup.getElement().style.pointerEvents = 'none';
    }, delay);
  };
  window.svPreview = { show: showHover, hide: hideHover };
  map.on('mousemove', e => {
    const onRoad = !popup?.isOpen() && map.getZoom() >= 14 &&
      map.queryRenderedFeatures(hitBox(e.point), { layers: ['cycling'] }).length > 0;
    map.getCanvas().style.cursor = onRoad ? 'pointer' : '';
  });
  map.getCanvas().addEventListener('mouseleave', hideHover);
  map.on('movestart', hideHover);
  map.on('click', hideHover);
  // light tile grid at zoom 14 (Squadrats), drawn only when zoomed in far enough
  const GRID_Z = 14, GRID_MIN_ZOOM = 12;
  const tileLon = x => x / 2 ** GRID_Z * 360 - 180;
  const tileLat = y => Math.atan(Math.sinh(Math.PI * (1 - 2 * y / 2 ** GRID_Z))) * 180 / Math.PI;
  const tileX = lon => (lon + 180) / 360 * 2 ** GRID_Z;
  const tileY = lat => (1 - Math.asinh(Math.tan(lat * Math.PI / 180)) / Math.PI) / 2 * 2 ** GRID_Z;
  map.addSource('grid14', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'grid14', type: 'line', source: 'grid14', minzoom: GRID_MIN_ZOOM,
    paint: { 'line-color': '#333', 'line-opacity': 0.55, 'line-width': 1.2 } }, 'cycling');
  function updateGrid() {
    const lines = [];
    if (map.getZoom() >= GRID_MIN_ZOOM) {
      const b = map.getBounds();
      const x0 = Math.floor(tileX(b.getWest())), x1 = Math.ceil(tileX(b.getEast()));
      const y0 = Math.floor(tileY(b.getNorth())), y1 = Math.ceil(tileY(b.getSouth()));
      for (let x = x0; x <= x1; x++)
        lines.push([[tileLon(x), tileLat(y0)], [tileLon(x), tileLat(y1)]]);
      for (let y = y0; y <= y1; y++)
        lines.push([[tileLon(x0), tileLat(y)], [tileLon(x1), tileLat(y)]]);
    }
    map.getSource('grid14').setData({ type: 'Feature', properties: {}, geometry: { type: 'MultiLineString', coordinates: lines } });
  }
  map.on('moveend', updateGrid);
  updateGrid();
  map.on('mousemove', e => {
    map.getCanvas().style.cursor = routeAt(e.point) || map.queryRenderedFeatures(hitBox(e.point), { layers: ['cycling'] }).length ? 'pointer' : '';
  });
});

// legend
const legend = document.getElementById('legend');
for (const [name, color, , dashed, arrow, label] of CLASSES) {
  if (name.startsWith('yes backward')) continue; // merged with 'yes forward' in the legend
  const tri = arrow === 1 ? `<polygon points="22,1 30,7 22,13" fill="#170a14"/>`
            : arrow === -1 ? `<polygon points="8,1 0,7 8,13" fill="#170a14"/>` : '';
  // same look as the map: solid line, with a white dashed overlay for dismount and the "probably" classes
  const overlay = ['dismount explicit', 'probably yes', 'probably no'].includes(name)
    ? `<line x1="2" y1="7" x2="28" y2="7" stroke="#fff" stroke-width="2" stroke-dasharray="2 4"/>` : '';
  const line = `<line x1="2" y1="7" x2="28" y2="7" stroke="${color}" stroke-width="${name.startsWith('no ') ? 2.5 : 4}"/>${overlay}`;
  legend.insertAdjacentHTML('beforeend',
    `<div class="item"><svg width="30" height="14">${line}${tri}</svg><span>${label}</span>` +
    `<button class="info" type="button" aria-label="Explain ${label}" aria-expanded="false">i</button></div>` +
    `<p class="desc" hidden>${DESCRIPTIONS[name]}</p>`);
}
const toggle = document.getElementById('toggle');
function setCollapsed(c) {
  legend.classList.toggle('collapsed', c);
  toggle.innerHTML = c ? '+' : '&minus;';
  toggle.setAttribute('aria-expanded', String(!c));
  toggle.setAttribute('aria-label', c ? 'Expand legend' : 'Collapse legend');
}
toggle.addEventListener('click', () => setCollapsed(!legend.classList.contains('collapsed')));
if (window.innerWidth < 600) setCollapsed(true); // start collapsed on small screens

legend.insertAdjacentHTML('beforeend', '<div id="route-legend"></div>');
legend.addEventListener('change', e => {
  const code = e.target.dataset?.route;
  if (code) map.setLayoutProperty('route-' + code, 'visibility', e.target.checked ? 'visible' : 'none');
});

legend.insertAdjacentHTML('beforeend',
  '<div class="item"><svg width="30" height="14"><rect x="3" y="1" width="24" height="12" fill="none" stroke="#333" stroke-opacity="0.7"/></svg><span>Tile grid z14 (Squadrats), from zoom 12</span></div>');

legend.addEventListener('click', e => {
  const btn = e.target.closest('button.info');
  if (!btn) return;
  const desc = btn.parentElement.nextElementSibling;
  const open = desc.hidden;
  legend.querySelectorAll('.desc').forEach(d => d.hidden = true);
  legend.querySelectorAll('.info').forEach(b => b.setAttribute('aria-expanded', 'false'));
  desc.hidden = !open;
  btn.setAttribute('aria-expanded', String(open));
});legend.insertAdjacentHTML('beforeend',
  '<div id="warning"><b>Disclaimer:</b> This map is based on OpenStreetMap data and is for information only. It may be incomplete, outdated or wrong. Always follow local traffic signs and traffic law. The creator accepts no responsibility or liability for fines, damages or accidents resulting from use of this map.</div>' +
  '<div id="note">Approximation from OpenFreeMap vector tiles (OpenMapTiles schema). ' +
  'Zoom in (≥ 10) to see the lines; click a way for its attributes. Cycle routes: <a href="https://www.maptoolkit.com/copyright/" target="_blank" rel="noopener">© Maptoolkit</a>. © OpenStreetMap contributors, OpenFreeMap.</div>');
</script>
